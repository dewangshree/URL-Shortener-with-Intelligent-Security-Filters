<!DOCTYPE html>
<html>
<head>
    <title> URL Shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaebed, #f8f6f9);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 14px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 20px;
            padding: 12px;
            background: #f0f4ff;
            border-radius: 8px;
            word-break: break-all;
        }

        .error {
            background: #ffe5e5;
            padding: 10px;
            margin-top: 15px;
            border-radius: 6px;
            color: #b00020;
            font-weight: bold;
        }

        .ai-box {
            background: #fff3cd;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            color: #333;
            text-align: left;
            font-size: 14px;
            line-height: 1.4;
        }

        a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            margin-top: 18px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2> URL Shortener</h2>

        <form method="post" action="/shorten">
            <input
                type="text"
                name="url"
                placeholder="Enter a long URL (e.g. https://example.com)"
                required
            >

            <select name="expiry">
                <option value="1h">Expire in 1 hour</option>
                <option value="1d">Expire in 1 day</option>
                <option value="7d">Expire in 7 days</option>
            </select>

            <button type="submit">Shorten URL</button>
        </form>

        <!-- Error (malicious URL blocked) -->
        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <!-- AI Explanation -->
        {% if llm_explanation %}
        <div class="ai-box">
            <b>🧠 AI Safety Explanation</b><br><br>
            {{ llm_explanation }}
        </div>
        {% endif %}

        <!-- Success -->
        {% if short_url %}
        <div class="result">
            <b>Short URL:</b><br>
            <a href="{{ short_url }}" target="_blank">{{ short_url }}</a><br><br>
            <b>Expires at:</b> {{ expiry_info }}
        </div>
        {% endif %}

        <div class="footer">
            Built with FastAPI + OpenAI
        </div>
    </div>
</body>
</html>
